video:
  sample_fps: 3.0

roi:
  x: 0.0
  y: 0.0
  width: 1.0
  height: 1.0
  ignore: []

# Analysis ROI and output crop are independent.
# roi controls slide-change detection.
# output.capture_roi controls only the image embedded in PPTX/PDF.
# If capture_roi is null, image_region: roi uses the analysis ROI.
# roi:
#   x: 0.05
#   y: 0.05
#   width: 0.75
#   height: 0.85
#   ignore:
#     - [0.00, 0.90, 1.00, 0.10]
#     - [0.85, 0.00, 0.15, 0.15]

detection:
  resize_width: 640
  gaussian_kernel: 5
  threshold_high: 0.030
  threshold_low: 0.010
  reference_threshold: 0.025
  stable_seconds: 1.5
  merge_threshold: 0.018
  min_slide_seconds: 1.0
  pixel_weight: 0.80
  edge_weight: 0.20
  canny_low: 60
  canny_high: 160
  png_compression: 3

whisper:
  enabled: true
  model: large-v3
  language: ja
  device: cuda
  compute_type: float16
  beam_size: 5
  vad_filter: true
  word_timestamps: false
  condition_on_previous_text: true

output:
  format: pptx
  image_region: roi
  capture_roi: null
  keep_intermediate: true
  save_debug_scores: true
  slide_width_in: 13.333333
  slide_height_in: 7.5

  # PDF defaults to slide image on the left and full transcript on the right.
  # If the transcript does not fit at pdf_min_font_size, continuation pages
  # are generated instead of truncating text.
  pdf_transcript_mode: side-by-side
  pdf_transcript_ratio: 0.40
  pdf_font_path: null
  pdf_font_size: 10.0
  pdf_min_font_size: 8.0
  pdf_margin_pt: 18.0
  pdf_gap_pt: 18.0
  pdf_page_width_in: null
  pdf_page_height_in: null
